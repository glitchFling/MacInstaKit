name: Download Lion 10.7

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # weekly Monday 6am (optional)

env:
  DMG_URL: "https://updates.cdn-apple.com/2021/macos/041-7683-20210614-E610947E-C7CE-46EB-8860-D26D71F0D3EA/InstallMacOSX.dmg"
  DMG_FILE: "InstallMacOSX.dmg"
  WORK_DIR: "${{ github.workspace }}/macos-installer"

jobs:
  extract-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full \
            dmg2img \
            curl \
            wget

      - name: Create working directory
        run: mkdir -p "${{ env.WORK_DIR }}"

      - name: Download macOS Installer DMG
        run: |
          echo "Downloading macOS installer... (Lion 10.7)"
          until curl -f -L -C - -o "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}" "${{ env.DMG_URL }}"; do
            echo "Download interrupted or failed. Retrying in 5 seconds..."
            sleep 5
          done
          ls -lh "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}"

      - name: Extract outer DMG
        run: |
          7z x "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}" \
            -o"${{ env.WORK_DIR }}/extracted" -y
          find "${{ env.WORK_DIR }}/extracted" -maxdepth 3 -type f -o -type d | head -30

      - name: Extract .pkg (xar) to get InstallESD.dmg
        run: |
          PKG_PATH=$(find "${{ env.WORK_DIR }}/extracted" -name "*.pkg" -type f | head -1)
          echo "Found .pkg at: $PKG_PATH"
          ls -lh "$PKG_PATH"
          mkdir -p "${{ env.WORK_DIR }}/extracted_pkg"
          python3 extract_xar.py "$PKG_PATH" "${{ env.WORK_DIR }}/extracted_pkg"
          echo "=== extracted_pkg contents ==="
          ls -lh "${{ env.WORK_DIR }}/extracted_pkg/"

      - name: Convert InstallESD.dmg to raw image
        run: |
          ESD_PATH=$(find "${{ env.WORK_DIR }}/extracted_pkg" -name "InstallESD.dmg" -type f | head -1)
          echo "Found InstallESD.dmg at: $ESD_PATH"
          ls -lh "$ESD_PATH"
          dmg2img -i "$ESD_PATH" -o "${{ env.WORK_DIR }}/InstallMacOSX.bin"
          ls -lh "${{ env.WORK_DIR }}/InstallMacOSX.bin"

      - name: List final output
        run: find "${{ env.WORK_DIR }}" -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Upload final image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstallMacOSX
          path: |
            ${{ env.WORK_DIR }}/InstallMacOSX.bin
            ${{ env.WORK_DIR }}/${{ env.DMG_FILE }}
          retention-days: 7