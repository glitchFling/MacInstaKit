name: Download Lion 10.7

on:
  workflow_dispatch:   manual trigger
  # schedule:
  #   - cron: "0 6 * * 1"   # weekly Monday 6am (optional)

env:
  DMG_URL: "https://updates.cdn-apple.com/2021/macos/041-7683-20210614-E610947E-C7CE-46EB-8860-D26D71F0D3EA/InstallMacOSX.dmg"
  DMG_FILE: "InstallMacOSX.dmg"
  WORK_DIR: "${{ github.workspace }}/macos-installer"

jobs:
  extract-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full \
            dmg2img \
            curl \
            wget

      - name: Create working directory
        run: mkdir -p "${{ env.WORK_DIR }}"

      - name: Download macOS Installer DMG
        run: |
          echo "Downloading macOS installer... (Lion 10.7)"
          until curl -f -L -C - -o "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}" "${{ env.DMG_URL }}"; do
            echo "Download interrupted or failed. Retrying in 5 seconds..."
            sleep 5
          done
          ls -lh "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}"

      - name: Extract outer DMG
        run: |
          7z x "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}" \
            -o"${{ env.WORK_DIR }}/extracted" -y
          find "${{ env.WORK_DIR }}/extracted" -maxdepth 3 -type f -o -type d | head -30

      - name: Extract .pkg (xar) using Python
        run: |
          PKG_PATH=$(find "${{ env.WORK_DIR }}/extracted" -name "*.pkg" -type f | head -1)
          echo "Found .pkg at: $PKG_PATH"
          ls -lh "$PKG_PATH"
          mkdir -p "${{ env.WORK_DIR }}/extracted_pkg"

          # Self-contained xar extractor in Python (no pip needed)
          python3 -c "
import struct, gzip, xml.etree.ElementTree as ET, os, shutil

def extract_xar(xar_path, out_dir):
    with open(xar_path, 'rb') as f:
        magic = f.read(4)
        assert magic == b'xar!', f'Not a xar archive: {magic}'
        header_size = struct.unpack('>H', f.read(2))[0]
        f.read(2)  # version
        toc_csize = struct.unpack('>Q', f.read(8))[0]  # compressed TOC size
        toc_size  = struct.unpack('>Q', f.read(8))[0]  # uncompressed TOC size
        f.read(4)  # checksum algorithm
        # skip to TOC start (header_size from beginning)
        f.seek(header_size)

        toc_compressed = f.read(toc_csize)
        toc_xml = gzip.decompress(toc_compressed).decode('utf-8')
        root = ET.fromstring(toc_xml)

        # heap starts after TOC
        heap_offset = header_size + toc_csize

        ns = {'x': 'http://xar.org/1.0.1/'}
        for file_elem in root.findall('.//x:file', ns):
            name = file_elem.find('x:name', ns)
            if name is None or not name.text or name.text == '.':
                continue
            path = name.text.lstrip('/')

            data = file_elem.find('x:data', ns)
            if data is None:
                continue

            length = int(data.find('x:length', ns).text)
            offset = int(data.find('x:offset', ns).text)
            extracted = data.find('x:extracted', ns)
            encoding = data.find('x:encoding', ns)
            if encoding is not None and encoding.text == 'gzip':
                # gzip-encoded subfiles
                pass  # handled below

            f.seek(heap_offset + offset)
            raw = f.read(length)

            if encoding is not None and encoding.text == 'gzip':
                import zlib
                try:
                    raw = gzip.decompress(raw)
                except:
                    pass

            out_path = os.path.join(out_dir, path)
            os.makedirs(os.path.dirname(out_path), exist_ok=True)
            with open(out_path, 'wb') as out:
                out.write(raw)
            size_mb = len(raw) / 1024 / 1024
            print(f'  {path}  ({size_mb:.1f} MB)')

extract_xar('$PKG_PATH', '${{ env.WORK_DIR }}/extracted_pkg')
"
          echo "--- extracted files ---"
          find "${{ env.WORK_DIR }}/extracted_pkg" -maxdepth 2 -type f

      - name: Extract Payload to get InstallESD.dmg
        run: |
          PAYLOAD_PATH=$(find "${{ env.WORK_DIR }}/extracted_pkg" -name "Payload" -type f | head -1)
          echo "Found Payload at: $PAYLOAD_PATH"
          mkdir -p "${{ env.WORK_DIR }}/payload_out"
          cd "${{ env.WORK_DIR }}/payload_out"
          cat "$PAYLOAD_PATH" | gunzip -dc | cpio -idm 2>/dev/null || \
            echo "Note: cpio may report blocks, that's normal"
          echo "--- Payload contents ---"
          find "${{ env.WORK_DIR }}/payload_out" -maxdepth 5 -type f | head -40

      - name: Convert InstallESD.dmg to raw image
        run: |
          ESD_PATH=$(find "${{ env.WORK_DIR }}/payload_out" -name "InstallESD.dmg" -type f | head -1)
          echo "Found InstallESD.dmg at: $ESD_PATH"
          ls -lh "$ESD_PATH"
          dmg2img -i "$ESD_PATH" -o "${{ env.WORK_DIR }}/InstallMacOSX.bin"
          ls -lh "${{ env.WORK_DIR }}/InstallMacOSX.bin"

      - name: List final output
        run: find "${{ env.WORK_DIR }}" -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Upload final image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstallMacOSX
          path: |
            ${{ env.WORK_DIR }}/InstallMacOSX.bin
            ${{ env.WORK_DIR }}/${{ env.DMG_FILE }}
          retention-days: 7