name: Download Lion 10.7

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # weekly Monday 6am (optional)

env:
  DMG_URL: "https://updates.cdn-apple.com/2021/macos/041-7683-20210614-E610947E-C7CE-46EB-8860-D26D71F0D3EA/InstallMacOSX.dmg"
  DMG_FILE: "InstallMacOSX.dmg"
  WORK_DIR: "${{ github.workspace }}/macos-installer"

jobs:
  extract-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full \
            dmg2img \
            curl \
            wget
          pip3 install xar --break-system-packages 2>/dev/null || true

      - name: Create working directory
        run: mkdir -p "${{ env.WORK_DIR }}"

      - name: Download macOS Installer DMG
        run: |
          echo "Downloading macOS installer... (Lion 10.7)"
          until curl -f -L -C - -o "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}" "${{ env.DMG_URL }}"; do
            echo "Download interrupted or failed. Retrying in 5 seconds..."
            sleep 5
          done
          ls -lh "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}"

      - name: Extract outer DMG
        run: |
          7z x "${{ env.WORK_DIR }}/${{ env.DMG_FILE }}" \
            -o"${{ env.WORK_DIR }}/extracted" -y
          find "${{ env.WORK_DIR }}/extracted" -maxdepth 3 -type f -o -type d | head -30

      - name: Extract .pkg and find InstallESD.dmg
        run: |
          PKG_PATH=$(find "${{ env.WORK_DIR }}/extracted" -name "*.pkg" -type f | head -1)
          echo "Found .pkg at: $PKG_PATH"
          ls -lh "$PKG_PATH"
          mkdir -p "${{ env.WORK_DIR }}/extracted_pkg"

          # Try xar from pip first, fall back to our Python extractor
          python3 extract_xar.py "$PKG_PATH" "${{ env.WORK_DIR }}/extracted_pkg" 2>&1
          echo "=== extracted_pkg tree ==="
          find "${{ env.WORK_DIR }}/extracted_pkg" -maxdepth 3 -type f | head -50

      - name: Locate InstallESD.dmg or the Payload file
        run: |
          echo "=== Searching for Payload ==="
          find "${{ env.WORK_DIR }}/extracted_pkg" -name "Payload" -type f 2>/dev/null | head -5
          echo "=== Searching for InstallESD.dmg ==="
          find "${{ env.WORK_DIR }}" -name "InstallESD.dmg" -type f 2>/dev/null | head -5
          echo "=== All files in extracted_pkg ==="
          find "${{ env.WORK_DIR }}/extracted_pkg" -type f 2>/dev/null | head -40

      - name: Extract Payload and find InstallESD.dmg
        run: |
          PAYLOAD_PATH=$(find "${{ env.WORK_DIR }}/extracted_pkg" -name "Payload" -type f | head -1)
          if [ -z "$PAYLOAD_PATH" ]; then
            echo "No Payload found — checking for InstallESD.dmg directly"
            ESD_PATH=$(find "${{ env.WORK_DIR }}/extracted_pkg" -name "InstallESD.dmg" -type f | head -1)
            if [ -n "$ESD_PATH" ]; then
              echo "Found InstallESD.dmg at: $ESD_PATH"
              dmg2img -i "$ESD_PATH" -o "${{ env.WORK_DIR }}/InstallMacOSX.bin"
              ls -lh "${{ env.WORK_DIR }}/InstallMacOSX.bin"
            else
              echo "Neither Payload nor InstallESD.dmg found"
              find "${{ env.WORK_DIR }}/extracted_pkg" -type f -o -type d | head -50
              exit 1
            fi
          else
            echo "Found Payload at: $PAYLOAD_PATH"
            ls -lh "$PAYLOAD_PATH"
            mkdir -p "${{ env.WORK_DIR }}/payload_out"
            # Try cpio + gunzip
            cd "${{ env.WORK_DIR }}/payload_out"
            if gunzip -dc < "$PAYLOAD_PATH" | cpio -idm 2>/dev/null; then
              echo "Payload extracted with gunzip+cpio"
            else
              # Maybe already decompressed by xar tool
              echo "gunzip failed, trying raw cpio..."
              cpio -idm < "$PAYLOAD_PATH" 2>/dev/null || echo "cpio also failed"
            fi
            echo "=== Payload contents ==="
            find "${{ env.WORK_DIR }}/payload_out" -maxdepth 6 -type f | head -40

            ESD_PATH=$(find "${{ env.WORK_DIR }}/payload_out" -name "InstallESD.dmg" -type f | head -1)
            if [ -n "$ESD_PATH" ]; then
              echo "Found InstallESD.dmg at: $ESD_PATH"
              dmg2img -i "$ESD_PATH" -o "${{ env.WORK_DIR }}/InstallMacOSX.bin"
              ls -lh "${{ env.WORK_DIR }}/InstallMacOSX.bin"
            else
              echo "Still no InstallESD.dmg found in payload"
              find "${{ env.WORK_DIR }}/payload_out" -type f | head -40
              exit 1
            fi
          fi

      - name: List final output
        run: find "${{ env.WORK_DIR }}" -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Upload final image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstallMacOSX
          path: |
            ${{ env.WORK_DIR }}/InstallMacOSX.bin
            ${{ env.WORK_DIR }}/${{ env.DMG_FILE }}
          retention-days: 7